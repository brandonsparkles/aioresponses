[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aioresponses"
version = "0.7.9"
description = "Mock aiohttp ClientSession requests"
readme = "README.rst"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pawel Nuckowski", email = "p.nuckowski@gmail.com"}]
dependencies = ["packaging>=22.0", "aiohttp>=3.8,<4.0"]

[project.urls]
Repository = "https://github.com/brandonsparkles/aioresponses"
Upstream = "https://github.com/pnuckowski/aioresponses"

[tool.poetry]
packages = [{include = "aioresponses"}]
include = ["aioresponses/py.typed"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=0.24", "pytest-cov>=7.1", "ddt>=1.7.2", "pytest-socket"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
